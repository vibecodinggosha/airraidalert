name: Deploy to EC2

on:
  push:
    branches:
      - claude/shelling-analytics-bot-JJTxT

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy to server
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            cd ~/airraidalert
            BASE="https://raw.githubusercontent.com/vibecodinggosha/airraidalert/claude/shelling-analytics-bot-JJTxT"
            wget -q "$BASE/bot.py" -O bot.py
            wget -q "$BASE/analyzer.py" -O analyzer.py
            wget -q "$BASE/parser.py" -O parser.py
            wget -q "$BASE/db.py" -O db.py
            wget -q "$BASE/config.py" -O config.py
            screen -S bot -X quit || true
            sleep 2
            screen -S bot -dm bash -c "cd ~/airraidalert && python3 bot.py"
            echo "Deployed OK"
